{% extends "base.html" %}{% block content %}<div class="form-wrap"><a href="/" class="d-block mb-4 text-decoration-none">← Back to Dashboard</a><div class="card-ui"><h3 class="page-title">New Sale</h3>
<p class="sub mb-4">Create a new sale record</p>{% if items %}<form method="post"><div class="mb-3"><label class="form-label">Select Medicine</label><select class="form-select" name="medicine_id" required><option value="">Choose Medicine</option>
{% for item in items %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Customer Name</label><input type="text" name="customer"  class="form-control" required></div><div class="mb-3"><label class="form-label">Quantity</label><input type="number" name="quantity" min="1" class="form-control" required></div><div class="mb-3"><label class="form-label">Sale Date</label><input type="date" name="sale_date"  class="form-control" required></div>
<button class="btn btn-primary">Save Sale</button><a href="/" class="btn btn-light border ms-2">Cancel</a></form>
{% else %}<div class="alert alert-warning">Add a medicine first.</div><a class="btn btn-primary" href="{{ url_for('add_item') }}">Add Medicine</a>{% endif %}</div></div>{% endblock %}
