{% extends "base.html" %}{% block content %}<div class="form-wrap"><a href="{{ url_for('index') }}" class="d-block mb-4 text-decoration-none">← Back to Dashboard</a><div class="card-ui"><h3 class="page-title">{{ 'Edit' if item else 'Add' }} Medicine</h3>
<p class="sub mb-4">Enter the medicine details below</p><form method="post"><div class="row g-3"><div class="col-md-6"><label class="form-label">Medicine Name</label><input class="form-control" type="text" maxlength="120" name="name" value="{{ item.name if item else '' }}" required></div>
<div class="col-md-6"><label class="form-label">Manufacturer</label><input class="form-control" type="text" maxlength="120" name="manufacturer" value="{{ item.manufacturer if item else '' }}" required></div>
<div class="col-md-6"><label class="form-label">Unit Price (₹)</label><input class="form-control" type="number" min="0.01" max="99999999.99" step="0.01" name="price" value="{{ item.price if item else '' }}" required></div>
<div class="col-md-6"><label class="form-label">Stock Quantity</label><input class="form-control" type="number" min="0" name="stock" value="{{ item.stock if item else '' }}" required></div></div>
<div class="mt-4"><button class="btn btn-primary">Save Medicine</button><a href="/" class="btn btn-light border ms-2">Cancel</a></div></form></div></div>{% endblock %}
