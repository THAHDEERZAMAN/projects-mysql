{% extends "base.html" %}{% block content %}<div class="form-wrap"><a href="/" class="d-block mb-4 text-decoration-none">← Back to Dashboard</a><div class="card-ui"><h3 class="page-title">New Borrowing</h3>
<p class="sub mb-4">Create a new borrowing record</p>{% if items %}<form method="post"><div class="mb-3"><label class="form-label">Select Book</label><select class="form-select" name="book_id" required><option value="">Choose Book</option>
{% for item in items %}<option value="{{ item.id }}">{{ item.title }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Borrower Name</label><input type="text" name="borrower"  class="form-control" required></div><div class="mb-3"><label class="form-label">Borrow Date</label><input type="date" name="borrow_date"  class="form-control" required></div><div class="mb-3"><label class="form-label">Status</label><select class="form-select" name="status"><option>Borrowed</option><option>Returned</option></select></div>
<button class="btn btn-primary">Save Borrowing</button><a href="/" class="btn btn-light border ms-2">Cancel</a></form>
{% else %}<div class="alert alert-warning">Add a book first.</div><a class="btn btn-primary" href="{{ url_for('add_item') }}">Add Book</a>{% endif %}</div></div>{% endblock %}
