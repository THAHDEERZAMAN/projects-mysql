<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New Order</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav class="navbar"><div class="container"><a href="/" class="brand">RestoFlow</a></div></nav>
<div class="container py-5"><div class="form-card"><a href="/" class="d-block mb-4 text-decoration-none">← Back to Dashboard</a><div class="main-card"><h3 class="page-title">Create New Order</h3><p class="subtitle mb-4">Enter customer and order details</p>
{% if menu_items %}<form method="POST"><div class="mb-3"><label class="form-label">Customer Name</label><input type="text" name="customer_name" class="form-control" placeholder="Enter customer name" maxlength="100" required></div><div class="mb-3"><label class="form-label">Select Food</label><select name="menu_id" class="form-select" required><option value="">Choose Food Item</option>{% for item in menu_items %}<option value="{{ item.id }}">{{ item.food_name }} - ₹{{ item.price }}</option>{% endfor %}</select></div><div class="mb-4"><label class="form-label">Quantity</label><input type="number" name="quantity" class="form-control" min="1" value="1" required></div><button type="submit" class="btn btn-primary">Place Order</button><a href="/" class="btn btn-light border ms-2">Cancel</a></form>
{% else %}<div class="alert alert-warning">Please add menu items before creating orders.</div><a href="/add_menu" class="btn btn-primary">Add Menu Item</a>{% endif %}
</div></div></div></body></html>
