<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add Food</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav class="navbar"><div class="container"><a href="/" class="brand">RestoFlow</a></div></nav>
<div class="container py-5"><div class="form-card"><a href="/" class="d-block mb-4 text-decoration-none">← Back to Dashboard</a><div class="main-card"><h3 class="page-title">Add Menu Item</h3><p class="subtitle mb-4">Add a new food item to your restaurant</p>
<form method="POST"><div class="mb-3"><label class="form-label">Food Name</label><input type="text" name="food_name" class="form-control" placeholder="Example: Chicken Biriyani" maxlength="100" required></div><div class="mb-3"><label class="form-label">Category</label><select name="category" class="form-select" required><option value="">Select Category</option><option>Starters</option><option>Main Course</option><option>Beverages</option><option>Desserts</option><option>Fast Food</option></select></div><div class="mb-4"><label class="form-label">Price (₹)</label><input type="number" name="price" class="form-control" min="0.01" max="99999999.99" step="0.01" placeholder="Enter price" required></div><button type="submit" class="btn btn-primary">Save Food Item</button><a href="/" class="btn btn-light border ms-2">Cancel</a></form>
</div></div></div></body></html>
