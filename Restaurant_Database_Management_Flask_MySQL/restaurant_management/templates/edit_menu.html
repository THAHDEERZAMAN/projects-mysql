<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit Food</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<nav class="navbar"><div class="container"><a href="/" class="brand">RestoFlow</a></div></nav>
<div class="container py-5"><div class="form-card"><a href="/" class="d-block mb-4 text-decoration-none">← Back to Dashboard</a><div class="main-card"><h3 class="page-title">Edit Menu Item</h3><p class="subtitle mb-4">Update food information and pricing</p>
<form method="POST"><div class="mb-3"><label class="form-label">Food Name</label><input type="text" name="food_name" class="form-control" value="{{ item.food_name }}" maxlength="100" required></div><div class="mb-3"><label class="form-label">Category</label><select name="category" class="form-select" required>{% for category in ['Starters','Main Course','Beverages','Desserts','Fast Food'] %}<option value="{{ category }}" {% if item.category == category %}selected{% endif %}>{{ category }}</option>{% endfor %}</select></div><div class="mb-4"><label class="form-label">Price (₹)</label><input type="number" name="price" class="form-control" value="{{ item.price }}" min="0.01" max="99999999.99" step="0.01" required></div><button type="submit" class="btn btn-primary">Update Menu Item</button><a href="/" class="btn btn-light border ms-2">Cancel</a></form>
</div></div></div></body></html>
