<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar"><div class="container"><a href="/" class="brand"><i class="bi bi-mortarboard-fill me-2"></i>CampusFlow</a></div></nav>
<div class="container py-5"><div class="form-card">
    <div class="mb-4"><a href="/" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Dashboard</a></div>
    <div class="main-card">
        <h3 class="page-title mb-2">Add New Student</h3>
        <p class="subtitle mb-4">Enter student details to create a new record</p>
        <form method="POST">
            <div class="row g-4">
                <div class="col-md-6"><label class="form-label">Full Name</label><input type="text" name="name" class="form-control" placeholder="Student full name" maxlength="100" required></div>
                <div class="col-md-6"><label class="form-label">Roll Number</label><input type="text" name="roll_no" class="form-control" placeholder="ST001" maxlength="30" required></div>
                <div class="col-md-6"><label class="form-label">Email Address</label><input type="email" name="email" class="form-control" placeholder="student@gmail.com" maxlength="100"></div>
                <div class="col-md-6"><label class="form-label">Department</label><select name="department" class="form-select" required>
                    <option value="">Select Department</option><option>Computer Science</option><option>Data Science</option><option>Commerce</option><option>Electronics</option><option>Mechanical</option>
                </select></div>
            </div>
            <hr class="my-4">
            <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle me-1"></i>Save Student</button>
            <a href="/" class="btn btn-light border ms-2">Cancel</a>
        </form>
    </div>
</div></div>
</body>
</html>
