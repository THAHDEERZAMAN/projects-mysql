<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}MediCare | Hospital Management{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"></head><body>
<nav class="navbar"><div class="container d-flex justify-content-between align-items-center">
<a class="brand" href="{{ url_for('index') }}"><i class="bi bi-hospital me-2"></i>MediCare</a>
<span class="text-white-50 small">Management Portal</span></div></nav>
<div class="container py-5">{% with messages=get_flashed_messages(with_categories=true) %}
{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</div></body></html>
