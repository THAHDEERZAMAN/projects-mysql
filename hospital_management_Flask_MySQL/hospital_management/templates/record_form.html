{% extends "base.html" %}{% block content %}<div class="form-wrap"><a href="/" class="d-block mb-4 text-decoration-none">← Back to Dashboard</a><div class="card-ui"><h3 class="page-title">New Appointment</h3>
<p class="sub mb-4">Create a new appointment record</p>{% if items %}<form method="post"><div class="mb-3"><label class="form-label">Select Patient</label><select class="form-select" name="patient_id" required><option value="">Choose Patient</option>
{% for item in items %}<option value="{{ item.id }}">{{ item.name }}</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Doctor Name</label><input type="text" name="doctor"  class="form-control" required></div><div class="mb-3"><label class="form-label">Appointment Date</label><input type="date" name="visit_date"  class="form-control" required></div><div class="mb-3"><label class="form-label">Status</label><select class="form-select" name="status"><option>Scheduled</option><option>Completed</option><option>Cancelled</option></select></div>
<button class="btn btn-primary">Save Appointment</button><a href="/" class="btn btn-light border ms-2">Cancel</a></form>
{% else %}<div class="alert alert-warning">Add a patient first.</div><a class="btn btn-primary" href="{{ url_for('add_item') }}">Add Patient</a>{% endif %}</div></div>{% endblock %}
